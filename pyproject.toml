[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chap_llm"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "chap-core",
    "pydantic>=2.0",
]

[tool.uv.sources]
chap-core = { path = "../chap-core", editable = true }

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
